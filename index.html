<!doctype html>
<!--

	is what https://magic-spells.github.io/cart/ hits. It exists only to hand the
	visitor to the flagship demo, which is a real page living where it is
	developed rather than a copy staged for publishing.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>@magic-spells/cart</title>
		<meta http-equiv="refresh" content="0; url=./packages/cart-panel/demo/" />
		<link rel="canonical" href="https://magic-spells.github.io/cart/packages/cart-panel/demo/" />
		<meta name="robots" content="noindex" />
	</head>
	<body>
		<!-- Seen only if the refresh is blocked or slow. -->
		<p>
			Redirecting to the
			<a href="./packages/cart-panel/demo/">@magic-spells/cart demo</a>.
		</p>
	</body>
</html>
